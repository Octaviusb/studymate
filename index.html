<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - Seleccionar Organización</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: 500px; width: 90%; }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 { color: #333; font-size: 2.5rem; margin-bottom: 0.5rem; }
        .logo p { color: #666; font-size: 1.1rem; }
        .org-list { margin-bottom: 2rem; }
        .org-card { border: 2px solid #e1e8ed; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; cursor: pointer; transition: all 0.3s; }
        .org-card:hover { border-color: #3498db; background: #f8f9fa; }
        .org-card.selected { border-color: #3498db; background: #e3f2fd; }
        .org-name { font-weight: bold; font-size: 1.2rem; color: #333; margin-bottom: 0.5rem; }
        .org-domain { color: #666; font-size: 0.9rem; }
        .org-plan { display: inline-block; background: #3498db; color: white; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; margin-top: 0.5rem; }
        .btn { width: 100%; padding: 1rem; background: #3498db; color: white; border: none; border-radius: 6px; font-size: 1.1rem; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #2980b9; }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        .admin-link { text-align: center; margin-top: 1rem; }
        .admin-link a { color: #3498db; text-decoration: none; font-size: 0.9rem; }
        .admin-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>StudyMate</h1>
            <p>Plataforma Educativa SaaS</p>
        </div>
        
        <div class="org-list">
            <div class="org-card selected" onclick="selectOrganization(1, 'Demo School')">
                <div class="org-name">Demo School</div>
                <div class="org-domain">demo.studymate.com</div>
                <div class="org-plan">PREMIUM</div>
            </div>
        </div>
        
        <button class="btn" onclick="continueToLogin()">
            Continuar al Login
        </button>
        
        <div class="admin-link">
            <a href="dashboard_saas.html">Acceso Administrador SaaS</a>
        </div>
    </div>

    <script>
        let selectedOrg = { id: 1, name: 'Demo School' };

        function selectOrganization(id, name) {
            selectedOrg = { id, name };
        }

        function continueToLogin() {
            localStorage.setItem('selected_organization', JSON.stringify(selectedOrg));
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
